<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu de Navegação -->
    <header class="menu">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#carrinho">Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Sobre a Loja -->
    <section id="home" class="sobre-loja">
        <div class="imagem-loja">
            <img src="./images/Screenshot_2.jpg" alt="Imagem da Loja">
        </div>
        <div class="texto-loja">
            <h2>Sobre a Loja</h2>
            <p>Bem-vindo à nossa loja virtual! Oferecemos uma seleção de produtos de qualidade com ótimo atendimento.</p>
        </div>
    </section>

    <!-- Seção de Produtos -->
    <section class="produtos">
        <h2>Produtos</h2>
        <div class="lista-produtos">
            <div class="produto">
                <img src="./images/cartucho1.jpg" alt="Produto 1">
                <h3>Produto 1</h3>
                <p>Descrição do produto 1</p>
                <button>Adicionar ao Carrinho</button>
            </div>
            <div class="produto">
                <img src="./images/cartucho1.jpg" alt="Produto 2">
                <h3>Produto 2</h3>
                <p>Descrição do produto 2</p>
                <button>Adicionar ao Carrinho</button>
            </div>
            <div class="produto">
                <img src="./images/cartucho1.jpg" alt="Produto 3">
                <h3>Produto 3</h3>
                <p>Descrição do produto 3</p>
                <button>Adicionar ao Carrinho</button>
            </div>
            <div class="produto">
                <img src="./images/cartucho1.jpg" alt="Produto 4">
                <h3>Produto 4</h3>
                <p>Descrição do produto 4</p>
                <button>Adicionar ao Carrinho</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
